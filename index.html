<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreamland</title>
    <style>
      :root {
        --orange: #ff7200;
        --charcoal: #4d4f51;
        --ink: #1d1d1d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 1142px;
        height: 100%;
        min-height: 706px;
        margin: 0;
        background: #ffffff;
        overflow: hidden;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }

      .canvas {
        position: relative;
        width: 1142px;
        height: 706px;
        margin: 0 auto;
        background: #fff;
      }

      .cover {
        position: absolute;
        top: 84px;
        left: 82px;
        width: 408px;
        height: 545px;
        overflow: hidden;
        background: var(--orange);
      }

      .cover__lower {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 143px;
        background: var(--charcoal);
      }

      .cover__circle {
        position: absolute;
        top: 294px;
        left: 225px;
        width: 148px;
        height: 148px;
        border: 2px solid #202426;
        border-radius: 50%;
        background: var(--orange);
      }

      .cover__copy {
        position: absolute;
        top: 444px;
        left: 0;
        width: 316px;
        text-align: center;
      }

      .cover__title {
        margin: 0;
        color: #f2f2f2;
        font-size: 30px;
        font-weight: 400;
        line-height: 36px;
        letter-spacing: -0.35px;
      }

      .cover__subtitle {
        margin: 3px 0 0;
        color: #8e8f90;
        font-size: 14px;
        line-height: 18px;
      }

      .preview {
        position: absolute;
        top: 84px;
        left: 620px;
        width: 410px;
        height: 547px;
        background: #fcfcfc;
      }

      .preview__circle {
        position: absolute;
        top: 49px;
        left: 127px;
        width: 160px;
        height: 160px;
        border: 1.5px solid #bdbdbd;
        border-radius: 50%;
        background: #fdfdfd;
      }

      .preview__row {
        position: absolute;
        left: 32px;
        width: 346px;
        height: 68px;
      }

      .preview__row--first {
        top: 259px;
      }

      .preview__row--second {
        top: 380px;
      }

      .preview__thumb {
        position: absolute;
        top: 0;
        left: 0;
        width: 68px;
        height: 67px;
        border: 1.5px solid #c5c5c5;
        border-radius: 9px;
        background: #fdfdfd;
      }

      .preview__name {
        position: absolute;
        top: 2px;
        left: 82px;
        margin: 0;
        color: #171717;
        font-size: 16px;
        font-weight: 600;
        line-height: 20px;
      }

      .preview__meta {
        position: absolute;
        top: 3px;
        right: 12px;
        margin: 0;
        color: #858585;
        font-size: 12px;
        line-height: 18px;
      }

      .preview__description {
        position: absolute;
        top: 36px;
        left: 82px;
        margin: 0;
        color: #999999;
        font-size: 13px;
        line-height: 18px;
      }

      .preview__divider {
        position: absolute;
        top: 355px;
        left: 101px;
        width: 309px;
        height: 1px;
        background: #dedede;
      }

      .preview__blocks {
        position: absolute;
        top: 34px;
        left: 83px;
        display: flex;
        gap: 7px;
      }

      .preview__block {
        width: 76px;
        height: 75px;
        background: #f1f1f1;
      }
    </style>
  </head>
  <body>
    <main class="canvas" aria-label="Dreamland cover and preview">
      <section class="cover" aria-label="Dreamland cover">
        <div class="cover__lower"></div>
        <div class="cover__circle" aria-hidden="true"></div>
        <div class="cover__copy">
          <p class="cover__title">Dream*land</p>
          <p class="cover__subtitle">Fulfill your dream</p>
        </div>
      </section>

      <section class="preview" aria-label="Dreamland preview list">
        <div class="preview__circle" aria-hidden="true"></div>

        <div class="preview__row preview__row--first">
          <div class="preview__thumb" aria-hidden="true"></div>
          <p class="preview__name">Dreamland</p>
          <p class="preview__meta">13:14</p>
          <p class="preview__description">To fulfill your dream</p>
        </div>

        <div class="preview__divider" aria-hidden="true"></div>

        <div class="preview__row preview__row--second">
          <div class="preview__thumb" aria-hidden="true"></div>
          <p class="preview__name">Dreamland</p>
          <div class="preview__blocks" aria-hidden="true">
            <span class="preview__block"></span>
            <span class="preview__block"></span>
            <span class="preview__block"></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
